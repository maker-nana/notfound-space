<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notfound.space — caustics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      cursor: crosshair;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
    }
    .site-title {
      position: fixed;
      top: 28px;
      left: 28px;
      z-index: 10;
      font-family: monospace;
      font-size: 14pt;
      color: rgba(255,255,255,1.0);
      user-select: none;
      pointer-events: none;
      letter-spacing: 0.02em;
    }
    .info {
      position: fixed;
      bottom: 24px;
      left: 28px;
      z-index: 10;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.05);
      user-select: none;
      pointer-events: none;
      line-height: 1.9;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="site-title">notfound.space</div>
  <div class="info">
    notfound.space — caustics<br>
    click &amp; drag to disturb
  </div>

  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl', { antialias: true }) || canvas.getContext('experimental-webgl', { antialias: true });
    const ext = gl.getExtension('OES_standard_derivatives');

    if (!gl) {
      document.body.innerHTML = '<p style="color:#333;font-family:monospace;padding:40px;">WebGL not supported</p>';
      throw new Error('No WebGL');
    }

    let W, H;
    let mouse = { x: 0.5, y: 0.5 };
    let mouseVel = { x: 0, y: 0 };
    let mouseActiveSmooth = 0;
    let lastActiveTime = -10;

    let isPressed = false;
    let pressStartTime = 0;
    let pressEnergy = 0;
    let dragActive = false;

    const MAX_RIPPLES = 32;
    let ripples = [];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      gl.viewport(0, 0, W, H);
    }

    const vsSource = `
      attribute vec2 a_position;
      void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fsSource = `
      #extension GL_OES_standard_derivatives : enable
      precision highp float;

      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_mouse;
      uniform vec2 u_mouseVel;
      uniform float u_mouseActive;

      uniform vec2 u_ripplePos[${MAX_RIPPLES}];
      uniform float u_rippleTime[${MAX_RIPPLES}];
      uniform float u_rippleStr[${MAX_RIPPLES}];
      uniform int u_rippleCount;

      mat2 rot(float a) {
        float c = cos(a), s = sin(a);
        return mat2(c, -s, s, c);
      }

      vec2 hash2(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
      }

      float hash1(vec2 p) {
        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
      }

      vec2 hashPoint(vec2 cell) {
        float x = fract(sin(dot(cell, vec2(127.1, 311.7))) * 43758.5453);
        float y = fract(sin(dot(cell, vec2(269.5, 183.3))) * 43758.5453);
        return vec2(x, y);
      }

      float gnoise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
        return mix(
          mix(dot(hash2(i), f),
              dot(hash2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0)), u.x),
          mix(dot(hash2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0)),
              dot(hash2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      float fbm(vec2 p) {
        float v = 0.0, a = 0.6;
        for (int i = 0; i < 4; i++) {
          v += a * gnoise(p);
          p = rot(0.37) * p * 2.0;
          a *= 0.45;
        }
        return v;
      }

      vec2 toWorld(vec2 uv) {
        float aspect = u_resolution.x / u_resolution.y;
        return vec2((uv.x - 0.5) * aspect, uv.y - 0.5) * 6.0;
      }

      float disturbanceEnergy(vec2 p) {
        float energy = 0.0;
        vec2 mp = toWorld(u_mouse);

        if (u_mouseActive > 0.01) {
          float d = length(p - mp);
          energy += exp(-d * 0.7) * u_mouseActive * 1.2;
        }

        for (int i = 0; i < ${MAX_RIPPLES}; i++) {
          if (i >= u_rippleCount) break;
          vec2 rp = toWorld(u_ripplePos[i]);
          float age = u_time - u_rippleTime[i];
          if (age < 0.0 || age > 6.0) continue;
          float d = length(p - rp);
          float decay = exp(-age * age * 0.15) * u_rippleStr[i];
          float spread = age * 1.2;
          energy += exp(-abs(d - spread) * 0.8) * decay * 0.7;
          energy += exp(-d * 1.0) * decay * 0.4;
        }

        return clamp(energy, 0.0, 1.0);
      }

      float surface(vec2 p) {
        float t = u_time * 0.06;

        float h = 0.0;
        h += sin(p.x * 0.5 + t * 0.8) * cos(p.y * 0.4 - t * 0.5) * 0.8;
        h += sin(p.x * 0.8 + p.y * 0.6 - t * 0.6) * 0.5;
        h += sin(p.y * 0.9 + t * 0.35 + p.x * 0.25) * 0.35;
        h += fbm(p * 0.4 + t * 0.12) * 0.7;
        h += gnoise(p * 1.0 + vec2(t * 0.15, -t * 0.12)) * 0.2;

        vec2 mp = toWorld(u_mouse);
        if (u_mouseActive > 0.01) {
          float d = length(p - mp);
          float wave = sin(d * 4.0 - u_time * 3.0) * exp(-d * 1.0);
          h += wave * 0.8 * u_mouseActive;

          float velMag = length(u_mouseVel);
          if (velMag > 0.001) {
            vec2 vd = normalize(u_mouseVel);
            float wake = max(dot(normalize(p - mp + 0.001), vd), 0.0);
            h += wake * sin(d * 6.0 - u_time * 4.0) * exp(-d * 1.3) * velMag * 3.0;
          }
        }

        for (int i = 0; i < ${MAX_RIPPLES}; i++) {
          if (i >= u_rippleCount) break;
          vec2 rp = toWorld(u_ripplePos[i]);
          float age = u_time - u_rippleTime[i];
          if (age < 0.0 || age > 6.0) continue;
          float d = length(p - rp);
          float decay = exp(-age * age * 0.15) * u_rippleStr[i];
          float spread = age * 0.9;
          float ring = sin((d - spread) * 6.0) * exp(-(d - spread) * (d - spread) * 1.2);
          h += ring * decay * 0.5;
        }

        return h;
      }

      float contourDist(vec2 p, float freq) {
        float h = surface(p);
        float contour = abs(fract(h * freq + 0.5) - 0.5) / freq;
        float e = 0.015;
        float hx = surface(p + vec2(e, 0.0));
        float hy = surface(p + vec2(0.0, e));
        float gradMag = length(vec2(hx - h, hy - h)) / e;
        return contour / max(gradMag, 0.001);
      }

      // Dot pattern along contour — varied sizes, soft gaussian
      float dotContour(vec2 p, float lineDist, float energy) {
        // Only compute near contour lines — wider zone for big dots
        if (lineDist > 0.06) return 0.0;

        // Proximity to line — soft falloff
        float lineProximity = exp(-lineDist * lineDist / 0.0003);

        // Two scales of noise for dot positions — creates varied clustering
        float n1 = gnoise(p * 40.0 + u_time * 0.05);  // fine dots
        float n2 = gnoise(p * 15.0 - u_time * 0.03);   // medium clusters
        float n3 = gnoise(p * 6.0 + u_time * 0.02);    // large variation

        // Combined noise → dot intensity at this point
        float dotNoise = n1 * 0.5 + n2 * 0.3 + n3 * 0.2;
        dotNoise = dotNoise * 0.5 + 0.5; // normalize to 0-1

        // Soft dot shape — varied sizes via noise
        // n3 controls local dot "size" — some areas have bigger dots, some smaller
        float dotSizeVar = 0.3 + (n3 * 0.5 + 0.5) * 0.7; // 0.3 to 1.0
        float dotShape = smoothstep(0.25 * dotSizeVar, 0.65 * dotSizeVar, dotNoise);

        // Overall dot brightness — soft gaussian modulation
        float brightness = dotShape * lineProximity;

        // Dissolve: earlier threshold + longer tail
        // Dots start disappearing at energy ~0.85
        float dissolveNoise = gnoise(p * 20.0 + u_time * 0.08) * 0.5 + 0.5;
        float dissolveNoise2 = gnoise(p * 7.0 - u_time * 0.04) * 0.5 + 0.5;
        float dissolveVal = dissolveNoise * 0.65 + dissolveNoise2 * 0.35;

        // pow(1-energy, 0.6) = earlier start, softer tail
        float threshold = pow(1.0 - energy, 0.6);
        // Wider smoothstep = more gradual fade per dot (lingering)
        float dissolveMask = smoothstep(threshold - 0.08, threshold + 0.12, dissolveVal);

        brightness *= dissolveMask;

        return clamp(brightness, 0.0, 1.0);
      }

      vec3 chromaticDots(vec2 p, float lineDist, float energy) {
        vec3 caTotal = vec3(0.0);
        float cellSize = 0.18;
        vec2 grid = p / cellSize;
        vec2 cell = floor(grid);

        float pixelNearLine = smoothstep(0.1, 0.01, lineDist);
        if (pixelNearLine < 0.001) return caTotal;

        for (int x = -1; x <= 1; x++) {
          for (int y = -1; y <= 1; y++) {
            vec2 neighbor = cell + vec2(float(x), float(y));

            float cellChance = hash1(neighbor + 500.0);
            if (cellChance > 0.90) continue;

            vec2 pt = hashPoint(neighbor);
            vec2 dotCenter = (neighbor + pt) * cellSize;

            float d = length(p - dotCenter);
            if (d > 0.05) continue;

            float scatterDist = hash1(neighbor + 400.0) * 0.06;
            float nearLine = smoothstep(0.005, 0.015, scatterDist)
                           * (1.0 - smoothstep(0.04, 0.1, scatterDist));

            float phase = hash1(neighbor + 50.0) * 6.28;
            float speed = 4.5 + hash1(neighbor + 100.0) * 8.0;
            float offset = hash1(neighbor + 150.0) * 100.0;
            float t = mod(u_time * speed + phase + offset, 6.28);
            float pulseWidth = 0.2 + hash1(neighbor + 200.0) * 0.25;
            float pulse = exp(-t * t / (pulseWidth * pulseWidth));

            float caAngle = hash1(neighbor + 300.0) * 6.28;
            vec2 caDir = vec2(cos(caAngle), sin(caAngle));
            float caSpread = 0.012 + hash1(neighbor + 350.0) * 0.015;

            float dotSize = 0.008 + hash1(neighbor + 250.0) * 0.01;
            float dotSizeSq = dotSize * dotSize;

            vec2 rPos = dotCenter + caDir * caSpread;
            vec2 gPos = dotCenter;
            vec2 bPos = dotCenter - caDir * caSpread;

            float rGlow = exp(-dot(p - rPos, p - rPos) / dotSizeSq);
            float gGlow = exp(-dot(p - gPos, p - gPos) / dotSizeSq);
            float bGlow = exp(-dot(p - bPos, p - bPos) / dotSizeSq);

            caTotal += vec3(rGlow, gGlow, bGlow) * pulse * nearLine * pixelNearLine;
          }
        }

        float caEnergy = energy * energy;
        caTotal *= smoothstep(0.02, 0.25, caEnergy);

        return clamp(caTotal, 0.0, 1.0);
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / u_resolution;
        vec2 p = toWorld(uv);

        float energy = disturbanceEnergy(p);

        float lineFreq = 3.5;

        // Contour distance
        float dist = contourDist(p, lineFreq);

        // Dot-based contour rendering
        float dots = dotContour(p, dist, energy);

        // Brightness variation
        float brightVar = gnoise(p * 3.0 + u_time * 0.2);
        brightVar = smoothstep(0.0, 0.8, brightVar * 0.5 + 0.5);
        dots *= mix(0.6, 1.0, brightVar);

        // Brightness by disturbance
        float baseBright = 0.15;
        float peakBright = 1.4;
        float brightness = mix(baseBright, peakBright, energy);
        float litDots = dots * brightness;
        litDots = clamp(litDots, 0.0, 1.0);

        // Chromatic dots
        vec3 ca = chromaticDots(p, dist, energy) * 1.5;

        // Cool blue-white
        vec3 col = vec3(0.85, 0.92, 1.0) * litDots;
        col += ca;

        // Vignette
        float vig = 1.0 - length(uv - 0.5) * 0.35;
        col *= vig;

        col = clamp(col, 0.0, 1.0);
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    function compile(src, type) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error('Shader error:', gl.getShaderInfoLog(s));
        return null;
      }
      return s;
    }

    const vs = compile(vsSource, gl.VERTEX_SHADER);
    const fs = compile(fsSource, gl.FRAGMENT_SHADER);
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('Link error:', gl.getProgramInfoLog(prog));
    }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(prog, 'a_position');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    const u = {
      res: gl.getUniformLocation(prog, 'u_resolution'),
      time: gl.getUniformLocation(prog, 'u_time'),
      mouse: gl.getUniformLocation(prog, 'u_mouse'),
      mouseVel: gl.getUniformLocation(prog, 'u_mouseVel'),
      mouseActive: gl.getUniformLocation(prog, 'u_mouseActive'),
      rippleCount: gl.getUniformLocation(prog, 'u_rippleCount'),
      ripplePos: [], rippleTime: [], rippleStr: [],
    };
    for (let i = 0; i < MAX_RIPPLES; i++) {
      u.ripplePos.push(gl.getUniformLocation(prog, `u_ripplePos[${i}]`));
      u.rippleTime.push(gl.getUniformLocation(prog, `u_rippleTime[${i}]`));
      u.rippleStr.push(gl.getUniformLocation(prog, `u_rippleStr[${i}]`));
    }

    const t0 = performance.now() / 1000;
    let rippleAccum = 0;

    function now() { return performance.now() / 1000 - t0; }

    function frame() {
      const t = now();
      gl.uniform2f(u.res, W, H);
      gl.uniform1f(u.time, t);

      if (isPressed) {
        const holdDuration = t - pressStartTime;
        pressEnergy = Math.min(1.0, holdDuration / 2.0);
        lastActiveTime = t;
      }

      const targetActive = isPressed ? pressEnergy : 0.0;

      if (isPressed) {
        mouseActiveSmooth += (targetActive - mouseActiveSmooth) * 0.12;
      } else {
        const decayRate = 0.04 + (1.0 - mouseActiveSmooth) * 0.08;
        mouseActiveSmooth += (targetActive - mouseActiveSmooth) * decayRate;
      }

      const velDecay = isPressed ? 0.95 : (0.9 + mouseActiveSmooth * 0.05);
      mouseVel.x *= velDecay;
      mouseVel.y *= velDecay;

      gl.uniform2f(u.mouse, mouse.x, mouse.y);
      gl.uniform2f(u.mouseVel, mouseVel.x, mouseVel.y);
      gl.uniform1f(u.mouseActive, mouseActiveSmooth);

      ripples = ripples.filter(r => (t - r.time) < 6.15);
      const count = Math.min(ripples.length, MAX_RIPPLES);
      gl.uniform1i(u.rippleCount, count);
      for (let i = 0; i < count; i++) {
        gl.uniform2f(u.ripplePos[i], ripples[i].x, ripples[i].y);
        gl.uniform1f(u.rippleTime[i], ripples[i].time);
        gl.uniform1f(u.rippleStr[i], ripples[i].str);
      }

      if (isPressed && pressEnergy > 0.05) {
        rippleAccum += 0.016;
        if (rippleAccum > 0.08 && ripples.length < MAX_RIPPLES) {
          ripples.push({ x: mouse.x, y: mouse.y, time: t, str: pressEnergy * 0.8 });
          rippleAccum = 0;
        }
      }

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }

    function getCoords(e) {
      const cx = e.clientX !== undefined ? e.clientX : e.touches[0].clientX;
      const cy = e.clientY !== undefined ? e.clientY : e.touches[0].clientY;
      return { nx: cx / W, ny: 1.0 - cy / H };
    }

    function onPressStart(e) {
      e.preventDefault();
      isPressed = true;
      dragActive = false;
      const t = now();
      pressStartTime = t;
      pressEnergy = 0;
      const { nx, ny } = getCoords(e);
      mouse.x = nx;
      mouse.y = ny;
      mouseVel.x = 0;
      mouseVel.y = 0;
      ripples.push({ x: nx, y: ny, time: t, str: 0.3 });
    }

    function onPressMove(e) {
      if (!isPressed) return;
      e.preventDefault();
      dragActive = true;
      const { nx, ny } = getCoords(e);
      const dx = nx - mouse.x;
      const dy = ny - mouse.y;
      mouseVel.x += dx * 2.5;
      mouseVel.y += dy * 2.5;
      mouse.x = nx;
      mouse.y = ny;
      const t = now();
      lastActiveTime = t;
      const vel = Math.sqrt(mouseVel.x * mouseVel.x + mouseVel.y * mouseVel.y);
      if (vel > 0.005 && ripples.length < MAX_RIPPLES) {
        ripples.push({ x: nx, y: ny, time: t, str: Math.min(vel * 3.0 + pressEnergy * 0.5, 1.8) });
      }
    }

    function onPressEnd(e) {
      if (!isPressed) return;
      e.preventDefault();
      const t = now();
      const burstStr = Math.min(pressEnergy * 1.5 + 0.3, 2.0);
      const burstCount = Math.floor(2 + pressEnergy * 4);
      for (let i = 0; i < burstCount && ripples.length < MAX_RIPPLES; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spread = Math.random() * 0.02 * pressEnergy;
        ripples.push({
          x: mouse.x + Math.cos(angle) * spread,
          y: mouse.y + Math.sin(angle) * spread,
          time: t + i * 0.02,
          str: burstStr * (0.7 + Math.random() * 0.3)
        });
      }
      lastActiveTime = t;
      isPressed = false;
      dragActive = false;
      pressEnergy = 0;
    }

    canvas.addEventListener('mousedown', onPressStart);
    window.addEventListener('mousemove', (e) => { if (isPressed) onPressMove(e); });
    window.addEventListener('mouseup', onPressEnd);
    canvas.addEventListener('touchstart', onPressStart, { passive: false });
    window.addEventListener('touchmove', (e) => { if (isPressed) onPressMove(e); }, { passive: false });
    window.addEventListener('touchend', onPressEnd, { passive: false });
    window.addEventListener('touchcancel', onPressEnd, { passive: false });
    window.addEventListener('resize', resize);

    resize();
    frame();
  </script>
</body>
</html>
